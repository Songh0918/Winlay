name: Build and publish release

"on":
  push:
    branches: [main]
    tags: ['v*']
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v11'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
          else
            tag="v10"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+([.][0-9]+)*$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build universal app
        run: WINLAY_SKIP_DMG=1 bash scripts/build-app.sh "$RUNNER_TEMP/winlay-release"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its assets unchanged."
            exit 0
          fi
          awk -v section="## $RELEASE_TAG" '$0 == section {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
            echo 'See CHANGELOG.md for details.' > "$RUNNER_TEMP/release-notes.md"
          fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/winlay-release/Winlay-macos-universal.zip" \
            "$RUNNER_TEMP/winlay-release/SHA256SUMS" \
            --target "$GITHUB_SHA" --title "Winlay $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
